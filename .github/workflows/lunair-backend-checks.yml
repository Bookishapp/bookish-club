name: Lunair backend checks
on:
  pull_request:
    paths:
      - "supabase/**"
      - ".github/workflows/lunair-backend-checks.yml"
  push:
    branches: [main]
    paths:
      - "supabase/**"
      - ".github/workflows/lunair-backend-checks.yml"
permissions:
  contents: read
concurrency:
  group: lunair-backend-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lunair-backend:
    name: Lunair Edge Functions and migration tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: supabase
    env:
      DENO_NO_PROMPT: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.8
      - name: Type-check both Lunair Edge Functions with frozen dependencies
        run: deno check --frozen --lock=deno.lock functions/lunair-shop-webhook/index.ts functions/lunair-library/index.ts
      - name: Test payment validation, delivery, library access, and the actual SQL migration
        # No network permission or service credentials are available to the tests.
        run: deno test --frozen --lock=deno.lock --allow-read --allow-env tests/lunair
