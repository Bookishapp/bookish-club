name: Deploy site
on:
  push:
    branches: [main]
  workflow_dispatch:
  # Hourly rebuild so newly verified clubs (confirmed claims / starts) move
  # to "On Bookish" without a code change.
  schedule:
    - cron: "17 * * * *"
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # SITE_URL / CUSTOM_DOMAIN come from repo variables so switching to
      # bookishclub.com is a settings change, not a code change.
      - run: node scripts/build.mjs
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://fictora.github.io/bookish-club' }}
          CUSTOM_DOMAIN: ${{ vars.CUSTOM_DOMAIN }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
